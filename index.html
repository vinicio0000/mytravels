<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa delle Foto</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 320px;
            background-color: #f8f9fa;
            border-right: 1px solid #ccc;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
            overflow-y: auto;
        }
        #map {
            flex-grow: 1;
            height: 100%;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: bold;
            font-size: 14px;
        }
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        #info {
            margin-top: auto;
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            font-size: 13px;
        }
        .popup-img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 4px;
            margin-bottom: 5px;
        }
        .popup-title {
            font-weight: bold;
            font-size: 14px;
        }
        .popup-date {
            color: #666;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <h2>Filtri</h2>
        
        <div class="filter-group">
            <label for="filtro-anno">Anno:</label>
            <select id="filtro-anno">
                <option value="Tutti">Tutti</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="filtro-viaggio">Viaggio:</label>
            <select id="filtro-viaggio">
                <option value="Tutti">Tutti</option>
            </select>
        </div>

        <div id="info">
            Foto caricate: <span id="totale-foto">0</span>
        </div>
    </div>

    <div id="map"></div>
</div>

<script>
    var map = L.map('map').setView([41.9028, 12.4964], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    var markers = L.markerClusterGroup();
    map.addLayer(markers);

    var tutteLeFoto = [];

    fetch('dati.json')
        .then(response => response.json())
        .then(data => {
            tutteLeFoto = data;
            initalizzaFiltri();
            aggiornaMappa();
        })
        .catch(err => console.error("Errore nel caricamento del file dati.json:", err));

    function initalizzaFiltri() {
        var anni = new Set();
        var viaggi = new Set();

        tutteLeFoto.forEach(f => {
            if (f.anno) anni.add(f.anno);
            if (f.viaggio) viaggi.add(f.viaggio);
        });

        var selectAnno = document.getElementById('filtro-anno');
        Array.from(anni).sort().reverse().forEach(anno => {
            var opt = document.createElement('option');
            opt.value = anno;
            opt.textContent = anno;
            selectAnno.appendChild(opt);
        });

        var selectViaggio = document.getElementById('filtro-viaggio');
        Array.from(viaggi).sort().forEach(viaggio => {
            var opt = document.createElement('option');
            opt.value = viaggio;
            opt.textContent = viaggio;
            selectViaggio.appendChild(opt);
        });

        selectAnno.addEventListener('change', aggiornaFiltroViaggi);
        selectViaggio.addEventListener('change', aggiornaMappa);
    }

    function aggiornaFiltroViaggi() {
        var annoSelezionato = document.getElementById('filtro-anno').value;
        var selectViaggio = document.getElementById('filtro-viaggio');
        
        selectViaggio.innerHTML = '<option value="Tutti">Tutti</option>';

        var viaggiFiltrati = new Set();
        tutteLeFoto.forEach(f => {
            if (annoSelezionato === 'Tutti' || f.anno === annoSelezionato) {
                if (f.viaggio) viaggiFiltrati.add(f.viaggio);
            }
        });

        Array.from(viaggiFiltrati).sort().forEach(viaggio => {
            var opt = document.createElement('option');
            opt.value = viaggio;
            opt.textContent = viaggio;
            selectViaggio.appendChild(opt);
        });

        aggiornaMappa();
    }

    function aggiornaMappa() {
        var anno = document.getElementById('filtro-anno').value;
        var viaggio = document.getElementById('filtro-viaggio').value;

        markers.clearLayers();

        var fotoFiltrate = tutteLeFoto.filter(f => {
            var matchAnno = (anno === 'Tutti' || f.anno === anno);
            var matchViaggio = (viaggio === 'Tutti' || f.viaggio === viaggio);
            return matchAnno && matchViaggio;
        });

        var bounds = [];

        fotoFiltrate.forEach(f => {
            if (f.lat && f.lon) {
                var marker = L.marker([f.lat, f.lon]);
                
                var contenutoPopup = `
                    <a href="${f.foto}" target="_blank">
                        <img src="${f.foto}" class="popup-img" alt="${f.nome}">
                    </a>
                    <div class="popup-title">${f.viaggio}</div>
                    <div class="popup-date">Data: ${f.data}</div>
                `;

                marker.bindPopup(contenutoPopup);
                markers.addLayer(marker);
                bounds.push([f.lat, f.lon]);
            }
        });

        document.getElementById('totale-foto').textContent = fotoFiltrate.length;

        if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [30, 30] });
        }
    }
</script>

</body>
</html>
