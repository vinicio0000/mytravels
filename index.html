<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Foto Georeferenziate</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Menu di selezione dell'anno */
    #filtro-anno-container {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #select-anno {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    /* Immagini nei Popup */
    .popup-foto {
      max-width: 220px;
      max-height: 160px;
      border-radius: 6px;
      margin-top: 8px;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Box Filtro Anno -->
  <div id="filtro-anno-container">
    <label for="select-anno"><b>Seleziona Anno:</b></label>
    <select id="select-anno" onchange="filtraPerAnno()">
      <option value="tutti">Tutti gli anni</option>
    </select>
  </div>

  <!-- Mappa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([41.9028, 12.4964], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let tuttiIDati = [];
    const layerMarkers = L.layerGroup().addTo(map);

    fetch('dati.json')
      .then(response => response.json())
      .then(dati => {
        tuttiIDati = dati;
        popolaSelettoreAnni(dati);
        disegnaMarker(dati);
      })
      .catch(err => console.error("Errore nel caricamento del file dati.json:", err));

    // Popola il menu a tendina estraendo solo gli anni numerici a 4 cifre
    function popolaSelettoreAnni(dati) {
      const select = document.getElementById('select-anno');
      const anni = new Set();

      dati.forEach(item => {
        let annoTrovato = null;

        if (item.anno && item.anno.length === 4 && !isNaN(item.anno)) {
          annoTrovato = item.anno;
        } else if (item.nome) {
          const primi4 = item.nome.substring(0, 4);
          if (/^\d{4}$/.test(primi4)) {
            annoTrovato = primi4;
          }
        }

        if (annoTrovato) {
          anni.add(annoTrovato);
        }
      });

      // Ordina gli anni come numeri (dal più recente al più vecchio)
      const anniOrdinati = Array.from(anni).sort((a, b) => Number(b) - Number(a));

      select.innerHTML = '<option value="tutti">Tutti gli anni</option>';
      
      anniOrdinati.forEach(anno => {
        const option = document.createElement('option');
        option.value = anno;
        option.textContent = anno;
        select.appendChild(option);
      });
    }

    function disegnaMarker(datiDaMostrare) {
      layerMarkers.clearLayers();
      const puntiValidi = [];

      datiDaMostrare.forEach(p => {
        const lat = parseFloat(p.lat);
        let lon = parseFloat(p.lon !== undefined ? p.lon : p.lng);

        if (lon > 180) lon = lon - 360;

        if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
          const marker = L.marker([lat, lon]);

          const popupContent = `
            <div style="text-align: center;">
              <b style="font-size: 13px;">${p.nome}</b><br>
              <a href="${p.foto}" target="_blank">
                <img src="${p.foto}" class="popup-foto" alt="${p.nome}">
              </a><br>
              <small><a href="${p.foto}" target="_blank" style="display:inline-block; margin-top:6px;">Ingrandisci foto 🔍</a></small>
            </div>
          `;

          marker.bindPopup(popupContent);
          layerMarkers.addLayer(marker);
          puntiValidi.push([lat, lon]);
        }
      });

      if (puntiValidi.length > 0) {
        const bounds = L.latLngBounds(puntiValidi);
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    function filtraPerAnno() {
      const annoSelezionato = document.getElementById('select-anno').value;

      if (annoSelezionato === 'tutti') {
        disegnaMarker(tuttiIDati);
      } else {
        const datiFiltrati = tuttiIDati.filter(item => {
          if (item.anno === annoSelezionato) return true;
          if (item.nome && item.nome.startsWith(annoSelezionato)) return true;
          return false;
        });
        disegnaMarker(datiFiltrati);
      }
    }
  </script>
</body>
</html>
