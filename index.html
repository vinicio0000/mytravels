<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO & Titolo Google -->
  <title>The Travel Map of Vinicio and Luisa</title>
  <meta name="description" content="Explore the travel memories, geotagged photos, and interactive map of Vinicio and Luisa around the world.">
  <meta name="keywords" content="The Travel Map of Vinicio and Luisa, Vinicio Luisa travel map, travel photos, geotagged map">
  <meta name="robots" content="index, follow">

  <!-- Open Graph per Social -->
  <meta property="og:title" content="The Travel Map of Vinicio and Luisa">
  <meta property="og:description" content="Explore our travel memories and interactive photo map around the world.">
  <meta property="og:type" content="website">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Intestazione Titolo e Sottotitolo */
    #header-container {
      position: absolute;
      top: 15px;
      left: 60px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      max-width: 80vw;
    }

    #header-container h1 {
      margin: 0;
      font-size: 18px;
      color: #2c3e50;
      font-weight: 700;
      line-height: 1.2;
    }

    #header-container p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #7f8c8d;
      font-style: italic;
    }

    /* Menu di selezione dell'anno */
    #filtro-anno-container {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #select-anno {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    /* Legenda dei colori */
    #legenda-container {
      position: absolute;
      bottom: 25px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      max-height: 250px;
      overflow-y: auto;
      display: none;
    }

    #legenda-container h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #333;
    }

    .legenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 13px;
      color: #444;
    }

    .legenda-color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      display: inline-block;
    }

    /* Style Tooltip (Passaggio Mouse) */
    .custom-tooltip {
      background: rgba(44, 62, 80, 0.9);
      color: #ffffff;
      border: none;
      border-radius: 5px;
      padding: 6px 10px;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .leaflet-tooltip-top:before {
      border-top-color: rgba(44, 62, 80, 0.9);
    }

    /* Immagini nei Popup */
    .popup-foto {
      max-width: 220px;
      max-height: 160px;
      border-radius: 6px;
      margin-top: 8px;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Reset stile icona SVG personalizzata */
    .custom-pin-icon {
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Box Titolo e Sottotitolo -->
  <div id="header-container">
    <h1>The Travel Map of Vinicio and Luisa</h1>
    <p>Our travel memories and geotagged moments around the world</p>
  </div>

  <!-- Box Filtro Anno -->
  <div id="filtro-anno-container">
    <label for="select-anno"><b>Select Year:</b></label>
    <select id="select-anno" onchange="filtraPerAnno()">
      <option value="tutti">All Years</option>
    </select>
  </div>

  <!-- Legenda Colori -->
  <div id="legenda-container">
    <h4>Years Legend</h4>
    <div id="legenda-items"></div>
  </div>

  <!-- Mappa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([41.9028, 12.4964], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let tuttiIDati = [];
    const layerMarkers = L.layerGroup().addTo(map);

    const mappaColoriAnni = {};

    const tavolozzaColori = [
      '#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', 
      '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4', 
      '#469990', '#dcbeff', '#9A6324', '#800000', '#000075'
    ];

    function creaIconaColorata(coloreHex) {
      const svgPin = `
        <svg width="25" height="41" viewBox="0 0 25 41" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 0C5.6 0 0 5.6 0 12.5C0 21.9 12.5 41 12.5 41C12.5 41 25 21.9 25 12.5C25 5.6 19.4 0 12.5 0Z" fill="${coloreHex}" stroke="#FFFFFF" stroke-width="1.5"/>
          <circle cx="12.5" cy="12.5" r="5" fill="#FFFFFF"/>
        </svg>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svgPin,
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
    }

    fetch('dati.json')
      .then(response => response.json())
      .then(dati => {
        tuttiIDati = dati;
        popolaSelettoreAnni(dati);
        filtraPerAnno();
      })
      .catch(err => console.error("Error loading dati.json:", err));

    function popolaSelettoreAnni(dati) {
      const select = document.getElementById('select-anno');
      const anni = new Set();

      dati.forEach(item => {
        let annoTrovato = null;

        if (item.anno && item.anno.length === 4 && !isNaN(item.anno)) {
          annoTrovato = item.anno;
        } else if (item.nome) {
          const primi4 = item.nome.substring(0, 4);
          if (/^\d{4}$/.test(primi4)) {
            annoTrovato = primi4;
          }
        }

        if (annoTrovato) {
          anni.add(annoTrovato);
        }
      });

      const anniOrdinati = Array.from(anni).sort((a, b) => Number(b) - Number(a));

      anniOrdinati.forEach((anno, index) => {
        mappaColoriAnni[anno] = tavolozzaColori[index % tavolozzaColori.length];
      });

      select.innerHTML = '<option value="tutti">All Years</option>';
      
      anniOrdinati.forEach(anno => {
        const option = document.createElement('option');
        option.value = anno;
        option.textContent = anno;
        select.appendChild(option);
      });

      aggiornaLegenda(anniOrdinati);
    }

    function aggiornaLegenda(anniOrdinati) {
      const containerItems = document.getElementById('legenda-items');
      containerItems.innerHTML = '';

      anniOrdinati.forEach(anno => {
        const item = document.createElement('div');
        item.className = 'legenda-item';
        item.innerHTML = `
          <span class="legenda-color-dot" style="background-color: ${mappaColoriAnni[anno]};"></span>
          <span><b>${anno}</b></span>
        `;
        containerItems.appendChild(item);
      });
    }

    function disegnaMarker(datiDaMostrare, usaColoriAnni) {
      layerMarkers.clearLayers();
      const puntiValidi = [];

      datiDaMostrare.forEach(p => {
        const lat = parseFloat(p.lat);
        let lon = parseFloat(p.lon !== undefined ? p.lon : p.lng);

        if (lon > 180) lon = lon - 360;

        if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
          
          let annoFoto = p.anno;
          if (!annoFoto || annoFoto.length !== 4) {
            annoFoto = p.nome ? p.nome.substring(0, 4) : '';
          }

          let opzioniMarker = {};

          if (usaColoriAnni && mappaColoriAnni[annoFoto]) {
            opzioniMarker.icon = creaIconaColorata(mappaColoriAnni[annoFoto]);
          }

          const marker = L.marker([lat, lon], opzioniMarker);

          // Info al passaggio del mouse (HOVER)
          const dataMostrata = p.data ? p.data : (p.anno ? p.anno : 'N/A');
          const tooltipContent = `<b>${p.nome}</b><br>📅 ${dataMostrata}`;
          
          marker.bindTooltip(tooltipContent, {
            direction: 'top',
            offset: [0, -35],
            className: 'custom-tooltip'
          });

          // Contenuto del Popup al CLICK
          const popupContent = `
            <div style="text-align: center;">
              <b style="font-size: 13px;">${p.nome}</b><br>
              <small style="color: #666;">📅 ${dataMostrata}</small><br>
              <a href="${p.foto}" target="_blank">
                <img src="${p.foto}" class="popup-foto" alt="${p.nome}">
              </a><br>
              <small><a href="${p.foto}" target="_blank" style="display:inline-block; margin-top:6px;">Enlarge photo 🔍</a></small>
            </div>
          `;

          marker.bindPopup(popupContent);
          layerMarkers.addLayer(marker);
          puntiValidi.push([lat, lon]);
        }
      });

      if (puntiValidi.length > 0) {
        const bounds = L.latLngBounds(puntiValidi);
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    function filtraPerAnno() {
      const annoSelezionato = document.getElementById('select-anno').value;
      const legendaBox = document.getElementById('legenda-container');

      if (annoSelezionato === 'tutti') {
        disegnaMarker(tuttiIDati, true);
        legendaBox.style.display = 'block';
      } else {
        const datiFiltrati = tuttiIDati.filter(item => {
          if (item.anno === annoSelezionato) return true;
          if (item.nome && item.nome.startsWith(annoSelezionato)) return true;
          return false;
        });
        disegnaMarker(datiFiltrati, false);
        legendaBox.style.display = 'none';
      }
    }
  </script>
</body>
</html>
