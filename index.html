<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa delle Mie Foto</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Inizializza la mappa
    const map = L.map('map').setView([41.9028, 12.4964], 6);

    // Mappa di base OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Chiamata dati.json
    fetch('dati.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Errore nella risposta di rete');
        }
        return response.json();
      })
      .then(dati => {
        dati.forEach(p => {
          // Estrazione sicura della latitudine e longitudine (gestisce sia "lon" che "lng")
          const lat = parseFloat(p.lat);
          const lon = parseFloat(p.lon !== undefined ? p.lon : p.lng);

          // Verifica che le coordinate siano numeri validi e diversi da 0
          if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
            const popupContent = `
              <div style="text-align: center;">
                <b>${p.nome}</b><br>
                <img src="${p.foto}" style="max-width: 200px; max-height: 150px; margin-top: 5px; border-radius: 4px;">
              </div>
            `;
            
            L.marker([lat, lon])
              .bindPopup(popupContent)
              .addTo(map);
          }
        });
      })
      .catch(err => {
        console.error('Errore durante il caricamento dei dati (CORS in locale o file mancante):', err);
      });
  </script>
</body>
</html>
