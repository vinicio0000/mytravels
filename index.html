<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa delle Miei Foto</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    /* Stile del menu filtro in sovrimpressione */
    .filtro-container {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .filtro-container label {
      font-weight: bold;
      margin-right: 5px;
    }
    .filtro-container select {
      padding: 5px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <div class="filtro-container">
    <label for="select-anno">Filtra per anno:</label>
    <select id="select-anno" onchange="filtraPerAnno()">
      <option value="tutti">Tutti gli anni</option>
    </select>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Inizializza la mappa
    const map = L.map('map').setView([41.9028, 12.4964], 6); // Coordinate default (Italia)

    // Aggiungi la mappa base (OpenStreetMap)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let tuttiIPunti = [];
    let layerGroup = L.layerGroup().addTo(map);

    // Carica il file dati.json
    fetch('dati.json')
      .then(response => response.json())
      .then(dati => {
        tuttiIPunti = dati;
        popolaSelezionaAnni(dati);
        mostraMarker(dati);
      })
      .catch(err => console.error('Errore nel caricamento del file JSON:', err));

    // Popola il menu a tendina con gli anni presenti nel JSON
    function popolaSelezionaAnni(dati) {
      const select = document.getElementById('select-anno');
      const anniSet = new Set();

      dati.forEach(p => {
        if (p.anno) anniSet.add(p.anno);
      });

      // Ordina gli anni dal più recente al più vecchio
      const anniOrdinati = Array.from(anniSet).sort((a, b) => b - a);

      anniOrdinati.forEach(anno => {
        const option = document.createElement('option');
        option.value = anno;
        option.textContent = anno;
        select.appendChild(option);
      });
    }

    // Disegna i marker sulla mappa
    function mostraMarker(punti) {
      layerGroup.clearLayers(); // Pulisce i vecchi marker

      punti.forEach(p => {
        // Mostra solo i punti con coordinate valide
        if (p.lat !== 0 && p.lng !== 0) {
          const popupContent = `
            <div style="text-align: center;">
              <b>${p.nome}</b> (${p.anno || ''})<br>
              <img src="${p.foto}" style="max-width: 200px; max-height: 150px; margin-top: 5px; border-radius: 4px;">
            </div>
          `;
          
          L.marker([p.lat, p.lng])
            .bindPopup(popupContent)
            .addTo(layerGroup);
        }
      });
    }

    // Funzione richiamata al cambio opzione del menu
    function filtraPerAnno() {
      const annoSelezionato = document.getElementById('select-anno').value;

      if (annoSelezionato === 'tutti') {
        mostraMarker(tuttiIPunti);
      } else {
        const puntiFiltrati = tuttiIPunti.filter(p => p.anno == annoSelezionato);
        mostraMarker(puntiFiltrati);
      }
    }
  </script>
</body>
</html>
