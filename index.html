<body>

  <!-- SCHERMATA DI BENVENUTO (SPLASH SCREEN) -->
  <div id="splash-screen" onclick="chiudiSplash()">

  <div id="header-container">

  <div id="filtro-container">

      <select id="select-anno" onchange="cambiaAnno()">

      </select>

    <div class="filtro-group">

    <div id="cluster-option-container">

        <input type="checkbox" id="check-cluster" onchange="aggiornaMappa()">
        Raggruppa punti (Clustering)
      </label>

    <button onclick="prevSlide()">◀ Prec</button>

    <div class="slideshow-speed-container">
      <select id="select-speed" onchange="cambiaVelocita()">
        <option value="2000">2s</option>
        <option value="4000" selected>4s</option>

    <span id="slideshow-counter">1 / 1</span>

  <div id="legenda-container">

  <div id="map"></div>

  <div id="imageModal" class="modal-foto" onclick="chiudiModalFoto(false)">
    <div id="modal-caption"></div>
    <img class="modal-foto-content" id="imgModalSrc" onclick="event.stopPropagation()">
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    // GESTIONE CONTO ALLA ROVESCIA SPLASH SCREEN
    let splashSeconds = 3;
    const splashTimer = setInterval(() => {
      splashSeconds--;
      const badge = document.getElementById('splash-countdown');
      if (badge) badge.textContent = splashSeconds;
      if (splashSeconds <= 0) {
        chiudiSplash();
      }
    }, 1000);

    function chiudiSplash() {
      clearInterval(splashTimer);
      const splash = document.getElementById('splash-screen');
      if (splash && splash.style.display !== 'none') {
        splash.style.opacity = '0';
        splash.style.visibility = 'hidden';
        setTimeout(() => {
          splash.style.display = 'none';
          map.invalidateSize();
          avviaPanIniziale(); // Avvia lo scorrimento fluido quadro per quadro
        }, 800);
      }
    }

    const map = L.map('map', { minZoom: 2 }).setView([40, -140], 3);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let tuttiIDati = [];
    let panInizialeAttivo = false;
    let animazionePanId = null;

    const clusterGroup = L.markerClusterGroup({ 
      disableClusteringAtZoom: 16,
      maxClusterRadius: 40 
    });
    const singleGroup = L.layerGroup();
    
    map.addLayer(clusterGroup);
    map.addLayer(singleGroup);

    const mappaColoriAnni = {};
    const tavolozzaColori = [
      '#e6194B', '#3cb44b', '#4363d8', '#f58231', '#911eb4', 
      '#42d4f4', '#f032e6', '#bfef45', '#fabed4', '#469990', 
      '#dcbeff', '#9A6324', '#800000', '#000075', '#a9a9a9', 
      '#808000', '#a30000', '#117864', '#1f618d', '#6c3483', 
      '#b03a2e', '#1e8449', '#283747', '#d35400', '#884ea0', 
      '#17a589', '#d81b60', '#3f51b5', '#009688', '#795548', 
      '#607d8b', '#e91e63', '#0288d1', '#558b2f', '#ad1457'
    ];

    let slideshowTimer = null;
    let isSlideshowActive = false;
    let isSlideshowPaused = false;
    let currentSlideIndex = 0;
    let tempoIntervallo = 4000;
    let puntiSlideshow = [];
    let markersSlideshow = [];
    let immaginiPrecaricate = [];

    let touchStartX = 0;
    let touchStartY = 0;

    // SCORRIMENTO FLUIDO DA ALASKA A GIAPPONE TRAMITE requestAnimationFrame
    function avviaPanIniziale() {
      panInizialeAttivo = true;
      map.setView([40, -140], 3, { animate: false });

      let startTime = null;
      const durataMs = 20000; // 20 secondi di scorrimento uniforme e progressivo

      const startLat = 40;
      const endLat = 30;
      const startLon = -140;
      const endLon = 140;

      function anima(timestamp) {
        if (!panInizialeAttivo) return;
        if (!startTime) startTime = timestamp;

        const trascorso = timestamp - startTime;
        const progresso = Math.min(trascorso / durataMs, 1);

        const currentLat = startLat + (endLat - startLat) * progresso;
        const currentLon = startLon + (endLon - startLon) * progresso;

        map.setView([currentLat, currentLon], 3, { animate: false });

        if (progresso < 1 && panInizialeAttivo) {
          animazionePanId = requestAnimationFrame(anima);
        } else {
          panInizialeAttivo = false;
        }
      }

      setTimeout(() => {
        if (panInizialeAttivo) {
          animazionePanId = requestAnimationFrame(anima);
        }
      }, 400);
    }

    function fermaPanIniziale() {
      if (panInizialeAttivo) {
        panInizialeAttivo = false;
        if (animazionePanId) {
          cancelAnimationFrame(animazionePanId);
          animazionePanId = null;
        }
      }
    }

    // Interrompe la panoramica automatica se l'utente interagisce
    map.on('dragstart zoomstart mousedown touchstart', fermaPanIniziale);

    function creaIconaColorata(coloreHex, isBig = false) {
      const w = isBig ? 32 : 25;
      const h = isBig ? 52 : 41;
      const svgPin = `
        <svg width="${w}" height="${h}" viewBox="0 0 25 41" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 0C5.6 0 0 5.6 0 12.5C0 21.9 12.5 41 12.5 41C12.5 41 25 21.9 25 12.5C25 5.6 19.4 0 12.5 0Z" fill="${coloreHex}" stroke="#FFFFFF" stroke-width="1.5"/>
          <circle cx="12.5" cy="12.5" r="5" fill="#FFFFFF"/>
        </svg>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svgPin,
        iconSize: [w, h],
        iconAnchor: [w / 2, h],
        popupAnchor: [1, -34]
      });
    }

    fetch('dati.json')
      .then(response => response.json())
      .then(dati => {
        tuttiIDati = dati;
        popolaAnni();
        popolaViaggi();
        document.getElementById('check-cluster').checked = false;
        aggiornaMappa();
      })
      .catch(err => console.error("Errore nel caricamento di dati.json:", err));

    function popolaAnni() {
      const selectAnno = document.getElementById('select-anno');
      const anni = new Set();

      tuttiIDati.forEach(p => {
        if (p.anno && p.anno !== "Sconosciuto") anni.add(p.anno);
      });

      const anniOrdinati = Array.from(anni).sort((a, b) => Number(b) - Number(a));

      anniOrdinati.forEach((anno, index) => {
        mappaColoriAnni[anno] = tavolozzaColori[index % tavolozzaColori.length];
      });

      selectAnno.innerHTML = '<option value="tutti">Tutti gli anni</option>';
      anniOrdinati.forEach(anno => {
        const option = document.createElement('option');
        option.value = anno;
        option.textContent = anno;
        selectAnno.appendChild(option);
      });

      aggiornaLegenda(anniOrdinati);
    }

    function popolaViaggi() {
      const selectAnno = document.getElementById('select-anno').value;
      const selectViaggio = document.getElementById('select-viaggio');
      const viaggiSet = new Set();

      tuttiIDati.forEach(p => {
        if (selectAnno === 'tutti' || p.anno === selectAnno) {
          if (p.viaggio) viaggiSet.add(p.viaggio);
        }
      });

      selectViaggio.innerHTML = '<option value="tutti">Tutti i viaggi</option>';
      Array.from(viaggiSet).sort().forEach(v => {
        const option = document.createElement('option');
        option.value = v;
        option.textContent = v;
        selectViaggio.appendChild(option);
      });
    }

    function cambiaAnno() {
      fermaPanIniziale();
      if (isSlideshowActive) fermaSlideshow();
      popolaViaggi();
      aggiornaMappa();
    }

    function cambiaViaggio() {
      fermaPanIniziale();
      if (isSlideshowActive) fermaSlideshow();
      aggiornaMappa();
    }

    function aggiornaMappa() {
      const annoSel = document.getElementById('select-anno').value;
      const viaggioSel = document.getElementById('select-viaggio').value;
      const legendaBox = document.getElementById('legenda-container');
      const clusterOptContainer = document.getElementById('cluster-option-container');
      const btnSlideshow = document.getElementById('btn-slideshow');
      const usaClusterCheckbox = document.getElementById('check-cluster').checked;
      const isSmartphone = window.innerWidth <= 900;

      if (viaggioSel === 'tutti') {
        clusterOptContainer.style.display = 'block';
        btnSlideshow.style.display = 'none';
      } else {
        clusterOptContainer.style.display = 'none';
        btnSlideshow.style.display = 'block';
      }

      clusterGroup.clearLayers();
      singleGroup.clearLayers();
      markersSlideshow = [];
      puntiSlideshow = [];

      let datiFiltrati = tuttiIDati;

      if (annoSel !== 'tutti') {
        datiFiltrati = datiFiltrati.filter(p => p.anno === annoSel);
        legendaBox.style.display = 'none';
      } else {
        legendaBox.style.display = isSmartphone ? 'none' : 'block';
      }

      if (viaggioSel !== 'tutti') {
        datiFiltrati = datiFiltrati.filter(p => p.viaggio === viaggioSel);
      }

      const puntiValidi = [];

      datiFiltrati.forEach((p) => {
        const lat = parseFloat(p.lat);
        const lon = parseFloat(p.lon);

        if (!isNaN(lat) && !isNaN(lon)) {
          let coloreHex = mappaColoriAnni[p.anno] || '#007bff';
          let opzioniMarker = {
            icon: creaIconaColorata(coloreHex)
          };

          const marker = L.marker([lat, lon], opzioniMarker);
          marker.coloreOriginale = coloreHex;

          const tooltipContent = `<b>${p.nome || p.viaggio}</b><br>📅 ${p.data}`;
          
          marker.bindTooltip(tooltipContent, {
            direction: 'top',
            offset: [0, -35],
            className: 'custom-tooltip'
          });

          const indexAttuale = puntiSlideshow.length;
          const fotoThumb = p.thumb || p.foto.replace(/^foto[\/\\]/, 'thumbs/');
          const htmlDescrizione = p.descrizione ? `<div class="popup-descrizione">${p.descrizione}</div>` : '';

          const popupContent = `
            <div class="popup-container">
              <b style="font-size: 13px;">${p.nome || p.viaggio}</b><br>
              <small style="color: #666;">📅 ${p.data}</small>
              ${htmlDescrizione}
              <img src="${fotoThumb}" class="popup-foto" alt="${p.nome}" onclick="apriModalFoto('${p.foto}', ${indexAttuale})">
              <a href="javascript:void(0)" onclick="apriModalFoto('${p.foto}', ${indexAttuale})" style="display:inline-block; margin-top:6px; color:#007bff; font-weight:bold; text-decoration:none; font-size:12px;">Ingrandisci foto 🔍</a>
            </div>
          `;

          marker.bindPopup(popupContent, { autoPanPadding: [20, 80] });

          if (viaggioSel === 'tutti' && usaClusterCheckbox) {
            clusterGroup.addLayer(marker);
          } else {
            singleGroup.addLayer(marker);
          }

          puntiValidi.push([lat, lon]);
          markersSlideshow.push(marker);
          puntiSlideshow.push(p);
        }
      });

      if (puntiValidi.length > 0 && !isSlideshowActive) {
        if (viaggioSel !== 'tutti') {
          fermaPanIniziale();
          const bounds = L.latLngBounds(puntiValidi);
          map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
        }
      }
    }

    function precaricaFotoSlideshow() {
      immaginiPrecaricate = [];
      puntiSlideshow.forEach(p => {
        if (p.foto) {
          const img = new Image();
          img.src = p.foto;
          immaginiPrecaricate.push(img);
        }
      });
    }

    function avviaSlideshow() {
      if (markersSlideshow.length === 0) return;
      fermaPanIniziale();

      precaricaFotoSlideshow();

      isSlideshowActive = true;
      isSlideshowPaused = false;
      currentSlideIndex = 0;

      document.body.classList.add('slideshow-active');

      document.getElementById('filtro-container').style.display = 'none';
      document.getElementById('slideshow-controls').style.display = 'flex';
      document.getElementById('btn-play-pause').textContent = '⏸ Pausa';

      tempoIntervallo = parseInt(document.getElementById('select-speed').value, 10) || 4000;

      setTimeout(() => {
        map.invalidateSize();
        mostraSlide(currentSlideIndex);
        avviaTimer();
      }, 100);
    }

    function cambiaVelocita() {
      tempoIntervallo = parseInt(document.getElementById('select-speed').value, 10) || 4000;
      if (isSlideshowActive && !isSlideshowPaused) {
        avviaTimer();
      }
    }

    function avviaTimer() {
      clearInterval(slideshowTimer);
      slideshowTimer = setInterval(() => {
        if (!isSlideshowPaused) {
          nextSlide();
        }
      }, tempoIntervallo);
    }

    function mostraSlide(index) {
      if (index < 0 || index >= markersSlideshow.length) return;

      map.invalidateSize({ pan: false });

      markersSlideshow.forEach((m, idx) => {
        const p = puntiSlideshow[idx];
        const col = mappaColoriAnni[p.anno] || '#007bff';
        m.setIcon(creaIconaColorata(col, false));
      });

      const activeMarker = markersSlideshow[index];
      activeMarker.setIcon(creaIconaColorata('#FFD700', true));

      const targetLatLng = activeMarker.getLatLng();
      const zoomLivello = map.getZoom() < 12 ? 12 : map.getZoom();
      map.setView(targetLatLng, zoomLivello, { animate: true });

      const p = puntiSlideshow[index];
      document.getElementById('slideshow-img').src = p.foto;
      
      const descTesto = p.descrizione ? ` — ${p.descrizione}` : '';
      document.getElementById('slideshow-caption').textContent = `${p.nome || p.viaggio} (${p.data})${descTesto}`;

      document.getElementById('slideshow-counter').textContent = `${index + 1} / ${markersSlideshow.length}`;
    }

    function nextSlide() {
      currentSlideIndex = (currentSlideIndex + 1) % markersSlideshow.length;
      mostraSlide(currentSlideIndex);
    }

    function prevSlide() {
      currentSlideIndex = (currentSlideIndex - 1 + markersSlideshow.length) % markersSlideshow.length;
      mostraSlide(currentSlideIndex);
    }

    function togglePlayPause() {
      isSlideshowPaused = !isSlideshowPaused;
      document.getElementById('btn-play-pause').textContent = isSlideshowPaused ? '▶ Riprendi' : '⏸ Pausa';
    }

    function fermaSlideshow() {
      isSlideshowActive = false;
      clearInterval(slideshowTimer);
      
      document.body.classList.remove('slideshow-active');
      map.invalidateSize();

      document.getElementById('filtro-container').style.display = 'flex';
      document.getElementById('slideshow-controls').style.display = 'none';
      
      aggiornaMappa();
    }

    function aggiornaLegenda(anniOrdinati) {
      const containerItems = document.getElementById('legenda-items');
      containerItems.innerHTML = '';
      anniOrdinati.forEach(anno => {
        const item = document.createElement('div');
        item.className = 'legenda-item';
        item.innerHTML = `
          <span class="legenda-color-dot" style="background-color: ${mappaColoriAnni[anno]};"></span>
          <span><b>${anno}</b></span>
        `;
        containerItems.appendChild(item);
      });
    }

    function apriModalFoto(urlFoto, index = -1) {
      fermaPanIniziale();
      const modal = document.getElementById('imageModal');
      modal.style.display = 'flex';
      document.getElementById('imgModalSrc').src = urlFoto;

      if (index !== -1 && puntiSlideshow[index]) {
        const p = puntiSlideshow[index];
        const descTesto = p.descrizione ? ` — ${p.descrizione}` : '';
        document.getElementById('modal-caption').textContent = `${p.nome || p.viaggio} (${p.data})${descTesto}`;
      } else {
        document.getElementById('modal-caption').textContent = '';
      }

      history.pushState({ modalOpen: true }, "");
    }

    function chiudiModalFoto(fromPopState = false) {
      const modal = document.getElementById('imageModal');
      if (modal.style.display !== 'none') {
        modal.style.display = 'none';

        if (!fromPopState && history.state && history.state.modalOpen) {
          history.back();
        }
      }
    }

    window.addEventListener('popstate', function(e) {
      const modal = document.getElementById('imageModal');
      if (modal.style.display !== 'none') {
        chiudiModalFoto(true);
      }
    });

    const photoPanel = document.getElementById('slideshow-photo-panel');

    photoPanel.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);

    photoPanel.addEventListener('touchend', function(e) {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX < 0) {
          nextSlide();
        } else {
          prevSlide();
        }
      }
    }, false);

    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") {
        chiudiModalFoto(false);
        if (isSlideshowActive) fermaSlideshow();
      }
    });

    window.addEventListener('resize', function() {
      map.invalidateSize();
    });
  </script>
</body>
</html>
