<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Interattiva e Slideshow Foto</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA DEI CONTROLLI */
    .controls-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 15px;
      background-color: #f4f4f9;
      border-bottom: 1px solid #ccc;
      z-index: 1000;
      flex-wrap: wrap;
    }

    .controls-bar select, 
    .controls-bar button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 4px;
      border: 1px solid #ccc;
      cursor: pointer;
    }

    .controls-bar button {
      background-color: #007bff;
      color: white;
      border: none;
      transition: background-color 0.2s;
    }

    .controls-bar button:hover {
      background-color: #0056b3;
    }

    #slideshow-controls {
      display: none;
      gap: 10px;
      align-items: center;
    }

    /* CONTENITORE MAPPA */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* MODALE FOTO */
    .modal-foto {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }

    .modal-foto-content {
      max-width: 90%;
      max-height: 85%;
      border-radius: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      object-fit: contain;
    }
  </style>
</head>
<body>

  <!-- BARRA CONTROLLI -->
  <div class="controls-bar">
    <div id="filtro-container">
      <label for="select-categoria"><strong>Filtra:</strong></label>
      <select id="select-categoria" onchange="filtraPunti(this.value)">
        <option value="tutti">Mostra Tutti</option>
      </select>
      <button onclick="avviaSlideshow()">▶ Avvia Slideshow</button>
    </div>

    <div id="slideshow-controls">
      <button id="btn-play-pause" onclick="togglePlayPause()">⏸ Pausa</button>
      <button onclick="slidePrecedente()">⏮ Prec</button>
      <button onclick="slideSuccessiva()">Susc ⏭</button>
      <label for="select-speed">Velocità:</label>
      <select id="select-speed" onchange="cambiaVelocita(this.value)">
        <option value="2000">2s</option>
        <option value="4000" selected>4s</option>
        <option value="6000">6s</option>
      </select>
      <button onclick="fermaSlideshow()" style="background-color: #dc3545;">⏹ Esci</button>
    </div>
  </div>

  <!-- MAPPA -->
  <div id="map"></div>

  <!-- MODALE INGRANDIMENTO FOTO -->
  <div id="imageModal" class="modal-foto" onclick="chiudiModalFoto()">
    <img class="modal-foto-content" id="imgModalSrc" onclick="event.stopPropagation()" alt="Foto ingrandita">
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // 1. NUOVA STRUTTURA DATI (Array di Oggetti)
    const datiMappa = [
      {
        id: 1,
        titolo: "Colosseo",
        categoria: "monumenti",
        punti: [41.89021, 12.492231],
        foto: "https://picsum.photos/id/1018/800/600",
        descrizione: "Anfiteatro Flavio a Roma"
      },
      {
        id: 2,
        titolo: "Duomo di Milano",
        categoria: "monumenti",
        punti: [45.464098, 9.191926],
        foto: "https://picsum.photos/id/1015/800/600",
        descrizione: "Cattedrale gotica nel centro di Milano"
      },
      {
        id: 3,
        titolo: "Parco Nazionale Gran Paradiso",
        categoria: "natura",
        punti: [45.5222, 7.3000],
        foto: "https://picsum.photos/id/1043/800/600",
        descrizione: "Area naturale protetta sulle Alpi"
      }
    ];

    // VARIABILI DI STATO
    let map;
    let markersGroup;
    let puntiFiltrati = [];
    let arrayImmaginiPrecaricate = [];
    
    let isSlideshowActive = false;
    let isSlideshowPaused = false;
    let currentSlideIndex = 0;
    let timerSlideshow = null;
    let tempoIntervallo = 4000;

    let touchStartX = 0;
    let touchStartY = 0;

    // INIZIALIZZAZIONE MAPPA
    function initMap() {
      map = L.map('map').setView([42.5, 12.5], 6);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);

      popolaFiltroCategorie();
      filtraPunti('tutti');
    }

    // POPOLA SELETTORE CATEGORIE
    function popolaFiltroCategorie() {
      const select = document.getElementById('select-categoria');
      const categorie = [...new Set(datiMappa.map(item => item.categoria))];
      
      categorie.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        select.appendChild(opt);
      });
    }

    // FILTRA PUNTI SULLA MAPPA
    function filtraPunti(categoria) {
      if (isSlideshowActive) fermaSlideshow();

      markersGroup.clearLayers();

      puntiFiltrati = categoria === 'tutti' 
        ? datiMappa 
        : datiMappa.filter(item => item.categoria === categoria);

      puntiFiltrati.forEach((item, index) => {
        // Uso del nuovo campo item.punti ([lat, lng])
        const marker = L.marker(item.punti);
        
        const popupContent = `
          <div style="text-align:center;">
            <h3>${item.titolo}</h3>
            <p>${item.descrizione}</p>
            <img src="${item.foto}" style="width:100%; max-width:200px; height:auto; margin-top:5px; cursor:pointer; border-radius:4px;" onclick="apriModalFoto('${item.foto}')">
          </div>
        `;
        
        marker.bindPopup(popupContent);
        markersGroup.addLayer(marker);
      });

      if (puntiFiltrati.length > 0) {
        const bounds = L.latLngBounds(puntiFiltrati.map(item => item.punti));
        map.fitBounds(bounds, { padding: [50, 50] });
      }
    }

    // PRECARICAMENTO IMMAGINI (Per fluidità slideshow)
    function precaricaFotoSlideshow() {
      arrayImmaginiPrecaricate = [];
      puntiFiltrati.forEach(item => {
        const img = new Image();
        img.src = item.foto;
        arrayImmaginiPrecaricate.push(img);
      });
    }

    // GESTIONE SLIDESHOW
    function avviaSlideshow() {
      if (puntiFiltrati.length === 0) return;

      precaricaFotoSlideshow();

      isSlideshowActive = true;
      isSlideshowPaused = false;
      currentSlideIndex = 0;

      document.getElementById('filtro-container').style.display = 'none';
      document.getElementById('slideshow-controls').style.display = 'flex';
      document.getElementById('btn-play-pause').textContent = '⏸ Pausa';

      tempoIntervallo = parseInt(document.getElementById('select-speed').value, 10) || 4000;

      mostraSlide(currentSlideIndex);
      avviaTimer();
    }

    function mostraSlide(index) {
      const item = puntiFiltrati[index];
      if (!item) return;

      // Centra la mappa sulle coordinate del punto corretto
      map.flyTo(item.punti, 13, { duration: 1.5 });

      markersGroup.eachLayer(marker => {
        const latLng = marker.getLatLng();
        if (latLng.lat === item.punti[0] && latLng.lng === item.punti[1]) {
          marker.openPopup();
        }
      });
    }

    function avviaTimer() {
      clearInterval(timerSlideshow);
      timerSlideshow = setInterval(() => {
        if (!isSlideshowPaused) {
          slideSuccessiva();
        }
      }, tempoIntervallo);
    }

    function slideSuccessiva() {
      currentSlideIndex = (currentSlideIndex + 1) % puntiFiltrati.length;
      mostraSlide(currentSlideIndex);
    }

    function slidePrecedente() {
      currentSlideIndex = (currentSlideIndex - 1 + puntiFiltrati.length) % puntiFiltrati.length;
      mostraSlide(currentSlideIndex);
    }

    function togglePlayPause() {
      isSlideshowPaused = !isSlideshowPaused;
      document.getElementById('btn-play-pause').textContent = isSlideshowPaused ? '▶ Riprendi' : '⏸ Pausa';
    }

    function cambiaVelocita(nuovaVelocita) {
      tempoIntervallo = parseInt(nuovaVelocita, 10);
      if (isSlideshowActive && !isSlideshowPaused) {
        avviaTimer();
      }
    }

    function fermaSlideshow() {
      isSlideshowActive = false;
      clearInterval(timerSlideshow);
      document.getElementById('slideshow-controls').style.display = 'none';
      document.getElementById('filtro-container').style.display = 'block';
      map.closePopup();
    }

    // GESTIONE MODALE FOTO & TOUCH/SWIPE
    function apriModalFoto(urlFoto) {
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('imgModalSrc');
      img.src = urlFoto;
      modal.style.display = 'flex';
    }

    function chiudiModalFoto() {
      document.getElementById('imageModal').style.display = 'none';
    }

    const modalEl = document.getElementById('imageModal');

    modalEl.addEventListener('touchstart', function(e) {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, false);

    modalEl.addEventListener('touchend', function(e) {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // Intercetta solo lo scorrimento orizzontale significativo
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX < 0) {
          slideSuccessiva();
        } else {
          slidePrecedente();
        }
        document.getElementById('imgModalSrc').src = puntiFiltrati[currentSlideIndex].foto;
      }
    }, false);

    // RIDIMENSIONAMENTO FINASTRA
    window.addEventListener('resize', function() {
      map.invalidateSize();
    });

    // AVVIO ALLA CARICA DELLA PAGINA
    window.onload = initMap;
  </script>
</body>
</html>
