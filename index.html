<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Foto Georeferenziate</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    /* Menu di selezione dell'anno */
    #filtro-anno-container {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #select-anno {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    /* Legenda dei colori (in basso a destra) */
    #legenda-container {
      position: absolute;
      bottom: 25px;
      right: 15px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      max-height: 250px;
      overflow-y: auto;
      display: none; /* Nascosto di default, visibile solo con "Tutti gli anni" */
    }

    #legenda-container h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #333;
    }

    .legenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 13px;
      color: #444;
    }

    .legenda-color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
      display: inline-block;
    }

    /* Immagini nei Popup */
    .popup-foto {
      max-width: 220px;
      max-height: 160px;
      border-radius: 6px;
      margin-top: 8px;
      object-fit: cover;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }

    /* Reset stile icona SVG personalizzata */
    .custom-pin-icon {
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Box Filtro Anno -->
  <div id="filtro-anno-container">
    <label for="select-anno"><b>Seleziona Anno:</b></label>
    <select id="select-anno" onchange="filtraPerAnno()">
      <option value="tutti">Tutti gli anni</option>
    </select>
  </div>

  <!-- Legenda Colori -->
  <div id="legenda-container">
    <h4>Legenda Anni</h4>
    <div id="legenda-items"></div>
  </div>

  <!-- Mappa -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map').setView([41.9028, 12.4964], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let tuttiIDati = [];
    const layerMarkers = L.layerGroup().addTo(map);

    // Mappa Anno -> Colore Hex
    const mappaColoriAnni = {};

    // Tavolozza di colori vivaci per distinguere bene gli anni
    const tavolozzaColori = [
      '#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', 
      '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4', 
      '#469990', '#dcbeff', '#9A6324', '#800000', '#000075'
    ];

    // Genera un'icona SVG colorata dello stesso stile di Leaflet
    function creaIconaColorata(coloreHex) {
      const svgPin = `
        <svg width="25" height="41" viewBox="0 0 25 41" xmlns="http://www.w3.org/2000/svg">
          <path d="M12.5 0C5.6 0 0 5.6 0 12.5C0 21.9 12.5 41 12.5 41C12.5 41 25 21.9 25 12.5C25 5.6 19.4 0 12.5 0Z" fill="${coloreHex}" stroke="#FFFFFF" stroke-width="1.5"/>
          <circle cx="12.5" cy="12.5" r="5" fill="#FFFFFF"/>
        </svg>
      `;
      return L.divIcon({
        className: 'custom-pin-icon',
        html: svgPin,
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34]
      });
    }

    fetch('dati.json')
      .then(response => response.json())
      .then(dati => {
        tuttiIDati = dati;
        popolaSelettoreAnni(dati);
        filtraPerAnno(); // Disegna i marker ed imposta la legenda iniziale
      })
      .catch(err => console.error("Errore nel caricamento del file dati.json:", err));

    // Popola il menu a tendina ed assegna un colore ad ogni anno
    function popolaSelettoreAnni(dati) {
      const select = document.getElementById('select-anno');
      const anni = new Set();

      dati.forEach(item => {
        let annoTrovato = null;

        if (item.anno && item.anno.length === 4 && !isNaN(item.anno)) {
          annoTrovato = item.anno;
        } else if (item.nome) {
          const primi4 = item.nome.substring(0, 4);
          if (/^\d{4}$/.test(primi4)) {
            annoTrovato = primi4;
          }
        }

        if (annoTrovato) {
          anni.add(annoTrovato);
        }
      });

      // Ordina gli anni in modo decrescente (dal più recente al più vecchio)
      const anniOrdinati = Array.from(anni).sort((a, b) => Number(b) - Number(a));

      // Assegna ad ogni anno un colore della tavolozza
      anniOrdinati.forEach((anno, index) => {
        mappaColoriAnni[anno] = tavolozzaColori[index % tavolozzaColori.length];
      });

      select.innerHTML = '<option value="tutti">Tutti gli anni</option>';
      
      anniOrdinati.forEach(anno => {
        const option = document.createElement('option');
        option.value = anno;
        option.textContent = anno;
        select.appendChild(option);
      });

      aggiornaLegenda(anniOrdinati);
    }

    // Costruisce la legenda visiva con i pallini colorati
    function aggiornaLegenda(anniOrdinati) {
      const containerItems = document.getElementById('legenda-items');
      containerItems.innerHTML = '';

      anniOrdinati.forEach(anno => {
        const item = document.createElement('div');
        item.className = 'legenda-item';
        item.innerHTML = `
          <span class="legenda-color-dot" style="background-color: ${mappaColoriAnni[anno]};"></span>
          <span><b>${anno}</b></span>
        `;
        containerItems.appendChild(item);
      });
    }

    // Disegna i marker sulla mappa
    function disegnaMarker(datiDaMostrare, usaColoriAnni) {
      layerMarkers.clearLayers();
      const puntiValidi = [];

      datiDaMostrare.forEach(p => {
        const lat = parseFloat(p.lat);
        let lon = parseFloat(p.lon !== undefined ? p.lon : p.lng);

        if (lon > 180) lon = lon - 360;

        if (!isNaN(lat) && !isNaN(lon) && lat !== 0 && lon !== 0) {
          
          // Trova l'anno per applicare il colore
          let annoFoto = p.anno;
          if (!annoFoto || annoFoto.length !== 4) {
            annoFoto = p.nome ? p.nome.substring(0, 4) : '';
          }

          let opzioniMarker = {};

          // Applica il colore dell'anno solo se siamo nella modalità "Tutti gli anni"
          if (usaColoriAnni && mappaColoriAnni[annoFoto]) {
            opzioniMarker.icon = creaIconaColorata(mappaColoriAnni[annoFoto]);
          }

          const marker = L.marker([lat, lon], opzioniMarker);

          const popupContent = `
            <div style="text-align: center;">
              <b style="font-size: 13px;">${p.nome}</b><br>
              <a href="${p.foto}" target="_blank">
                <img src="${p.foto}" class="popup-foto" alt="${p.nome}">
              </a><br>
              <small><a href="${p.foto}" target="_blank" style="display:inline-block; margin-top:6px;">Ingrandisci foto 🔍</a></small>
            </div>
          `;

          marker.bindPopup(popupContent);
          layerMarkers.addLayer(marker);
          puntiValidi.push([lat, lon]);
        }
      });

      if (puntiValidi.length > 0) {
        const bounds = L.latLngBounds(puntiValidi);
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
      }
    }

    // Gestisce il filtro anno e la visibilità della legenda
    function filtraPerAnno() {
      const annoSelezionato = document.getElementById('select-anno').value;
      const legendaBox = document.getElementById('legenda-container');

      if (annoSelezionato === 'tutti') {
        // Mostra i colori e la legenda
        disegnaMarker(tuttiIDati, true);
        legendaBox.style.display = 'block';
      } else {
        // Mostra le puntine standard blu e nasconde la legenda
        const datiFiltrati = tuttiIDati.filter(item => {
          if (item.anno === annoSelezionato) return true;
          if (item.nome && item.nome.startsWith(annoSelezionato)) return true;
          return false;
        });
        disegnaMarker(datiFiltrati, false);
        legendaBox.style.display = 'none';
      }
    }
  </script>
</body>
</html>
