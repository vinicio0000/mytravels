<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa Foto GPS</title>
  
  <!-- Foglio di stile Leaflet per la mappa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; }
    
    #map { flex: 3; height: 100%; }
    
    #sidebar { 
      flex: 1; 
      height: 100%; 
      background: #f8f9fa; 
      border-left: 2px solid #dee2e6; 
      padding: 20px; 
      overflow-y: auto; 
    }
    
    h2 { margin-bottom: 10px; font-size: 1.2rem; color: #333; }
    .info-text { color: #666; font-size: 0.85rem; margin-bottom: 15px; }
    
    .gallery { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
      gap: 10px; 
    }
    
    .gallery img { 
      width: 100%; 
      height: 80px; 
      object-fit: cover; 
      border-radius: 6px; 
      cursor: pointer; 
      border: 1px solid #ccc;
      transition: transform 0.2s;
    }

    .gallery img:hover { transform: scale(1.05); }
    
    .error-msg {
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      padding: 10px;
      border-radius: 5px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar">
    <h2>Galleria Fotografica</h2>
    <p class="info-text">Clicca su un punto o sulla miniatura per centrare la foto sulla mappa.</p>
    <div id="error-container"></div>
    <div id="gallery" class="gallery"></div>
  </div>

  <!-- Libreria Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. Inizializza la Mappa centrata sull'Italia
    const map = L.map('map').setView([41.9028, 12.4964], 6);
    
    // Inserisce i tasselli OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const bounds = [];

    // 2. Carica ed elabora il file dati.json
    fetch('dati.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Impossibile caricare il file dati.json (Stato: ' + response.status + ')');
        }
        return response.json();
      })
      .then(punti => {
        const gallery = document.getElementById('gallery');

        if (!punti || punti.length === 0) {
          document.getElementById('error-container').innerHTML = 
            '<div class="error-msg">⚠️ Il file dati.json è vuoto o non contiene punti GPS validi.</div>';
          return;
        }

        punti.forEach(p => {
          // Crea il Marker sulla mappa
          const marker = L.marker([p.lat, p.lng]).addTo(map);
          
          // Contenuto del fumetto Popup
          const popupContent = `
            <div style="text-align:center;">
              <strong>${p.nome}</strong><br>
              <img src="${p.foto}" style="max-width:200px; max-height:150px; border-radius:4px; margin-top:5px; object-fit:cover;">
            </div>
          `;
          marker.bindPopup(popupContent);

          // Crea l'elemento miniatura nella barra laterale
          const img = document.createElement('img');
          img.src = p.foto;
          img.alt = p.nome;
          img.title = p.nome;
          
          // Cliccando sulla foto nella barra laterale ci si sposta sul marker
          img.onclick = () => {
            map.setView([p.lat, p.lng], 15);
            marker.openPopup();
          };
          
          gallery.appendChild(img);

          // Registra le coordinate per la centratura automatica dello zoom
          bounds.push([p.lat, p.lng]);
        });

        // Adatta automaticamente lo zoom per mostrare tutti i punti inseriti
        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [50, 50] });
        }
      })
      .catch(err => {
        console.error("Errore nel caricamento dei dati JSON:", err);
        document.getElementById('error-container').innerHTML = 
          '<div class="error-msg">❌ Errore nel caricamento di <strong>dati.json</strong>.<br>Se sei in locale senza server web, il browser potrebbe aver bloccato il file per sicurezza (CORS).</div>';
      });
  </script>
</body>
</html>
