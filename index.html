<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa dei Miei Viaggi</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
        }
        
        /* Layout principale */
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Pannello di controllo superiore */
        #controls {
            background-color: #ffffff;
            padding: 12px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #007bff;
        }

        #stats {
            margin-left: auto;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* Mappa */
        #map {
            flex-grow: 1;
            width: 100%;
            height: 100%;
        }

        /* Popup personalizzato */
        .popup-content {
            text-align: center;
            max-width: 250px;
        }

        .popup-content img {
            width: 100%;
            max-height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .popup-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
            color: #2c3e50;
        }

        .popup-date {
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="controls">
            <div class="control-group">
                <label for="select-anno">Anno:</label>
                <select id="select-anno">
                    <option value="Tutti">Tutti gli Anni</option>
                </select>
            </div>

            <div class="control-group">
                <label for="select-viaggio">Viaggio (Cartella):</label>
                <select id="select-viaggio">
                    <option value="Tutti">Tutti i Viaggi</option>
                </select>
            </div>

            <div id="stats">Caricamento...</div>
        </div>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        let mappa;
        let markersCluster;
        let datiFoto = [];

        // Inizializzazione della Mappa
        function initMap() {
            mappa = L.map('map').setView([41.9028, 12.4964], 5); // Coordinate iniziali: Italia

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(mappa);

            markersCluster = L.markerClusterGroup({
                chunkedLoading: true,
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false
            });

            mappa.addLayer(markersCluster);

            caricaDati();
        }

        // Caricamento del file JSON
        function caricaDati() {
            fetch('dati.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Impossibile caricare dati.json");
                    }
                    return response.json();
                })
                .then(dati => {
                    datiFoto = dati;
                    popolaFiltri();
                    aggiornaMappa();
                })
                .catch(err => {
                    console.error("Errore nel caricamento dei dati:", err);
                    document.getElementById('stats').innerText = "Errore nel caricamento del file dati.json";
                });
        }

        // Popola i menu a tendina Anno e Viaggio
        function popolaFiltri() {
            const selectAnno = document.getElementById('select-anno');
            const selectViaggio = document.getElementById('select-viaggio');

            const anni = new Set();
            const viaggi = new Set();

            datiFoto.forEach(f => {
                if (f.anno) anni.add(f.anno);
                if (f.viaggio) viaggi.add(f.viaggio);
            });

            // Ordina e aggiungi gli anni
            Array.from(anni).sort().reverse().forEach(anno => {
                const opt = document.createElement('option');
                opt.value = anno;
                opt.textContent = anno;
                selectAnno.appendChild(opt);
            });

            // Ordina e aggiungi i viaggi (nomi delle sottocartelle)
            Array.from(viaggi).sort().forEach(viaggio => {
                const opt = document.createElement('option');
                opt.value = viaggio;
                opt.textContent = viaggio;
                selectViaggio.appendChild(opt);
            });

            selectAnno.addEventListener('change', gestisciCambioAnno);
            selectViaggio.addEventListener('change', aggiornaMappa);
        }

        // Aggiorna le opzioni dei viaggi quando si seleziona un anno
        function gestisciCambioAnno() {
            const annoSelezionato = document.getElementById('select-anno').value;
            const selectViaggio = document.getElementById('select-viaggio');

            // Salva la selezione corrente
            const viaggioCorrente = selectViaggio.value;

            // Svuota i viaggi tenendo solo "Tutti"
            selectViaggio.innerHTML = '<option value="Tutti">Tutti i Viaggi</option>';

            const viaggiFiltrati = new Set();
            datiFoto.forEach(f => {
                if (annoSelezionato === "Tutti" || f.anno === annoSelezionato) {
                    if (f.viaggio) viaggiFiltrati.add(f.viaggio);
                }
            });

            Array.from(viaggiFiltrati).sort().forEach(viaggio => {
                const opt = document.createElement('option');
                opt.value = viaggio;
                opt.textContent = viaggio;
                selectViaggio.appendChild(opt);
            });

            // Ripristina il viaggio se fa parte del nuovo anno, altrimenti "Tutti"
            if (viaggiFiltrati.has(viaggioCorrente)) {
                selectViaggio.value = viaggioCorrente;
            } else {
                selectViaggio.value = "Tutti";
            }

            aggiornaMappa();
        }

        // Disegna i marker sulla mappa in base ai filtri
        function aggiornaMappa() {
            const annoSelezionato = document.getElementById('select-anno').value;
            const viaggioSelezionato = document.getElementById('select-viaggio').value;

            markersCluster.clearLayers();

            const fotoFiltrate = datiFoto.filter(f => {
                const matchAnno = (annoSelezionato === "Tutti" || f.anno === annoSelezionato);
                const matchViaggio = (viaggioSelezionato === "Tutti" || f.viaggio === viaggioSelezionato);
                return matchAnno && matchViaggio;
            });

            const bounds = [];

            fotoFiltrate.forEach(f => {
                if (f.lat && f.lon) {
                    const marker = L.marker([f.lat, f.lon]);
                    
                    const popupHtml = `
                        <div class="popup-content">
                            <a href="${f.foto}" target="_blank">
                                <img src="${f.foto}" alt="${f.nome}" loading="lazy" />
                            </a>
                            <div class="popup-title">${f.viaggio}</div>
                            <div class="popup-date">📅 ${f.data}</div>
                        </div>
                    `;

                    marker.bindPopup(popupHtml);
                    markersCluster.addLayer(marker);
                    bounds.push([f.lat, f.lon]);
                }
            });

            // Aggiorna contatore
            document.getElementById('stats').innerText = `Foto visibili: ${fotoFiltrate.length}`;

            // Centra la mappa sui dati filtrati se presenti
            if (bounds.length > 0) {
                mappa.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
            }
        }

        // Avvio all'apertura della pagina
        window.onload = initMap;
    </script>
</body>
</html>
