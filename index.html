<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mappa dei Viaggi in Camper e Viaggi Indipendenti - Vinicio e Luisa</title>
  <meta name="description" content="Esplora la geografia dei percorsi, le tappe e i viaggi in camper e indipendenti nel mondo realizzati da Vinicio e Luisa.">
  <meta name="keywords" content="viaggi, geografia, camper, viaggi indipendenti, itinerari, mappa geografica">
  
  <!-- Leaflet CSS & Leaflet MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Dati Strutturati Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Mappa dei Viaggi in Camper e Viaggi Indipendenti - Vinicio e Luisa",
    "description": "Esplora la geografia dei percorsi, le tappe e i viaggi in camper e indipendenti nel mondo realizzati da Vinicio e Luisa.",
    "url": "https://vinicio0000.github.io/mytravels/",
    "keywords": "viaggi, geografia, camper, viaggi indipendenti, itinerari, mappa geografica",
    "inLanguage": "it"
  }
  </script>

  <style>
    /* Base & Layout Responsivo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* dvh ottimizzato per browser mobile */
      overflow: hidden;
      background-color: #f8f9fa;
    }

    /* Barra Superiore / Filtri */
    header {
      background: #1e293b;
      color: #ffffff;
      padding: 10px 15px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
    }
    .filters {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    select {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #334155;
      color: #ffffff;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: #38bdf8;
    }

    /* Contenitore Mappa */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    /* Stile Popup Leaflet */
    .popup-container {
      max-width: 240px;
      font-size: 13px;
      line-height: 1.4;
    }
    .popup-descrizione {
      margin: 6px 0;
      color: #334155;
    }
    .popup-foto {
      width: 100%;
      height: auto;
      max-height: 150px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 6px;
      cursor: pointer;
    }

    /* Modal Slideshow Foto */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      touch-action: pan-y pinch-zoom;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      position: relative;
      max-width: 90%;
      max-height: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .modal-caption {
      color: #ffffff;
      margin-top: 10px;
      text-align: center;
      font-size: 0.9rem;
    }
    .modal-close {
      position: absolute;
      top: 15px; right: 20px;
      color: #ffffff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      z-index: 2010;
      background: none;
      border: none;
      line-height: 1;
    }
    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #ffffff;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.4);
      border: none;
      padding: 10px 15px;
      border-radius: 50%;
      user-select: none;
      z-index: 2010;
      transition: background 0.2s;
    }
    .modal-nav:hover {
      background: rgba(0, 0, 0, 0.8);
    }
    .modal-prev { left: 10px; }
    .modal-next { right: 10px; }
  </style>
</head>
<body>

  <!-- Intestazione e Filtri -->
  <header>
    <h1>🌍 Viaggi in Camper & Indipendenti</h1>
    <div class="filters">
      <select id="filterViaggio" onchange="applicaFiltri()">
        <option value="tutti">Tutti i viaggi</option>
      </select>
      <select id="filterAnno" onchange="applicaFiltri()">
        <option value="tutti">Tutti gli anni</option>
      </select>
    </div>
  </header>

  <!-- Elemento Mappa -->
  <div id="map"></div>

  <!-- Modal per Visualizzazione e Slideshow Immagini -->
  <div id="fotoModal" class="modal">
    <button class="modal-close" onclick="chiudiModalFoto()">&times;</button>
    <button class="modal-nav modal-prev" onclick="cambiaFoto(-1)">&#10094;</button>
    <div class="modal-content">
      <img id="modalImg" class="modal-img" src="" alt="Foto tappa">
      <div id="modalCaption" class="modal-caption"></div>
    </div>
    <button class="modal-nav modal-next" onclick="cambiaFoto(1)">&#10095;</button>
  </div>

  <!-- Librerie JavaScript CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Script Principale -->
  <script>
    // Variabili Globali
    let map, markersCluster;
    let tuttiPunti = [];
    let puntiFiltrati = [];
    let puntiSlideshow = [];
    let modalIndex = 0;
    let touchStartX = 0;
    let touchEndX = 0;

    // Inizializzazione della pagina
    document.addEventListener("DOMContentLoaded", () => {
      // Inizializza la mappa centrata su Roma
      map = L.map('map').setView([41.9028, 12.4964], 5);

      // TileLayer OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 18
      }).addTo(map);

      // Gruppo Marker Cluster
      markersCluster = L.markerClusterGroup({
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true
      });
      map.addLayer(markersCluster);

      // Caricamento Dati
      caricaDati();
      setupTouchSwipe();
    });

    // Fetch del file dati.json
    async function caricaDati() {
      try {
        const response = await fetch('dati.json');
        if (!response.ok) throw new Error('Impossibile caricare il file dati.json');
        tuttiPunti = await response.json();
        
        popolaFiltri(tuttiPunti);
        applicaFiltri();
      } catch (err) {
        console.error('Errore nel caricamento dei dati:', err);
      }
    }

    // Popolamento dei Menu a tendina (Filtri Viaggi ed Anni)
    function popolaFiltri(punti) {
      const selectViaggio = document.getElementById('filterViaggio');
      const selectAnno = document.getElementById('filterAnno');

      const viaggi = new Set();
      const anni = new Set();

      punti.forEach(p => {
        if (p.viaggio) viaggi.add(p.viaggio);
        if (p.data) {
          const anno = p.data.substring(0, 4);
          if (anno && !isNaN(anno)) anni.add(anno);
        }
      });

      Array.from(viaggi).sort().forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        selectViaggio.appendChild(opt);
      });

      Array.from(anni).sort((a, b) => b - a).forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        opt.textContent = a;
        selectAnno.appendChild(opt);
      });
    }

    // Logica di Filtro
    function applicaFiltri() {
      const viaggioSelezionato = document.getElementById('filterViaggio').value;
      const annoSelezionato = document.getElementById('filterAnno').value;

      puntiFiltrati = tuttiPunti.filter(p => {
        const matchViaggio = (viaggioSelezionato === 'tutti') || (p.viaggio === viaggioSelezionato);
        const annoPunto = p.data ? p.data.substring(0, 4) : '';
        const matchAnno = (annoSelezionato === 'tutti') || (annoPunto === annoSelezionato);
        return matchViaggio && matchAnno;
      });

      aggiornaMappa();
    }

    // Aggiornamento dei Marker sulla mappa
    function aggiornaMappa() {
      markersCluster.clearLayers();
      puntiSlideshow = [];

      const bounds = L.latLngBounds();

      puntiFiltrati.forEach(p => {
        if (!p.lat || !p.lng) return;

        const latLng = [p.lat, p.lng];
        bounds.extend(latLng);

        // Controllo e gestione sicura Immagini/Thumbnail
        const fotoUrl = p.foto || '';
        const fotoThumb = p.thumb || (fotoUrl ? fotoUrl.replace(/^foto[\/\\]/, 'thumbs/') : '');
        
        let indexSlideshow = -1;
        if (fotoUrl) {
          indexSlideshow = puntiSlideshow.length;
          puntiSlideshow.push({
            url: fotoUrl,
            titolo: p.nome || p.viaggio || '',
            data: p.data || ''
          });
        }

        const htmlDescrizione = p.descrizione ? `<div class="popup-descrizione">${p.descrizione}</div>` : '';
        const htmlFoto = fotoThumb ? `
          <img src="${fotoThumb}" class="popup-foto" alt="${p.nome || 'Tappa'}" onclick="apriModalFoto('${fotoUrl}', ${indexSlideshow})">
          <a href="javascript:void(0)" onclick="apriModalFoto('${fotoUrl}', ${indexSlideshow})" style="display:inline-block; margin-top:6px; color:#007bff; font-weight:bold; text-decoration:none; font-size:12px;">Ingrandisci foto 🔍</a>
        ` : '';

        const popupContent = `
          <div class="popup-container">
            <b style="font-size: 13px;">${p.nome || p.viaggio}</b><br>
            <small style="color: #666;">📅 ${p.data || ''}</small>
            ${htmlDescrizione}
            ${htmlFoto}
          </div>
        `;

        const marker = L.marker(latLng);
        marker.bindPopup(popupContent);
        markersCluster.addLayer(marker);
      });

      // Adatta lo zoom per mostrare tutti i punti filtrati
      if (puntiFiltrati.length > 0 && bounds.isValid()) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    // Apertura Modal & History API per gestire il pulsante "Indietro" dei browser mobile
    function apriModalFoto(fotoUrl, index) {
      if (!fotoUrl || index < 0) return;
      modalIndex = index;
      mostraFoto(modalIndex);

      const modal = document.getElementById('fotoModal');
      modal.classList.add('active');

      history.pushState({ modalOpen: true }, '');
    }

    function mostraFoto(index) {
      if (puntiSlideshow.length === 0) return;
      const item = puntiSlideshow[index];
      
      const modalImg = document.getElementById('modalImg');
      const modalCaption = document.getElementById('modalCaption');

      modalImg.src = item.url;
      modalCaption.innerHTML = `<b>${item.titolo}</b> ${item.data ? '(' + item.data + ')' : ''}`;
    }

    function cambiaFoto(step) {
      if (puntiSlideshow.length === 0) return;
      modalIndex = (modalIndex + step + puntiSlideshow.length) % puntiSlideshow.length;
      mostraFoto(modalIndex);
    }

    function chiudiModalFoto() {
      const modal = document.getElementById('fotoModal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
        if (history.state && history.state.modalOpen) {
          history.back();
        }
      }
    }

    // Gestione Evento Tasto Indietro (Browser / Mobile)
    window.addEventListener('popstate', (e) => {
      const modal = document.getElementById('fotoModal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
      }
    });

    // Tastiera (ESC, Frecce Destra / Sinistra)
    document.addEventListener('keydown', (e) => {
      const modal = document.getElementById('fotoModal');
      if (!modal.classList.contains('active')) return;

      if (e.key === 'Escape') chiudiModalFoto();
      if (e.key === 'ArrowLeft') cambiaFoto(-1);
      if (e.key === 'ArrowRight') cambiaFoto(1);
    });

    // Supporto Touch Swipe su Mobile
    function setupTouchSwipe() {
      const modal = document.getElementById('fotoModal');

      modal.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      modal.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
      }, { passive: true });
    }

    function handleSwipe() {
      const threshold = 50; // Soglia minima swipe in px
      if (touchEndX < touchStartX - threshold) {
        cambiaFoto(1);  // Swipe a sinistra -> Foto successiva
      }
      if (touchEndX > touchStartX + threshold) {
        cambiaFoto(-1); // Swipe a destra -> Foto precedente
      }
    }
  </script>
</body>
</html>
